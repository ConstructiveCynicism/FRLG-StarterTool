name: Release

on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x
    - name: Publish
      run: dotnet publish src/FRLG.StarterTool.App -p:PublishProfile=win-x64
    - name: Check the published exe is self-contained
      shell: pwsh
      run: |
        $exe = "src/FRLG.StarterTool.App/bin/publish/win-x64/FRLGStarterTool.exe"
        if (-not (Test-Path $exe)) { throw "No published exe at $exe" }
        $size = (Get-Item $exe).Length
        if ($size -lt 20MB) {
          throw "$exe is $([math]::Round($size / 1MB, 1)) MB; the self-contained build is ~63 MB. This looks like the apphost stub from bin/Release."
        }
        Write-Host "$exe is $([math]::Round($size / 1MB, 1)) MB"
    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: FRLGStarterTool
        path: src/FRLG.StarterTool.App/bin/publish/win-x64/FRLGStarterTool.exe
    - name: Attach to release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: src/FRLG.StarterTool.App/bin/publish/win-x64/FRLGStarterTool.exe
